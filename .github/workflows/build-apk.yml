name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Environment and Dummy Files
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          
          # Umgebungsvariablen anlegen
          echo "GEMINI_API_KEY=dummy_key" > .env
          echo "GEMINI_API_KEY=dummy_key" > .env.example
          if [ -d "app" ]; then
            echo "GEMINI_API_KEY=dummy_key" > app/.env
            echo "GEMINI_API_KEY=dummy_key" > app/.env.example
            echo "sdk.dir=$ANDROID_SDK_ROOT" > app/local.properties
          fi

          # Debug Keystore generieren, falls er fehlt
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -d "app" ] && [ ! -f "app/debug.keystore" ]; then
            cp debug.keystore app/debug.keystore
          fi

          # Dummy google-services.json erzeugen, falls erforderlich
          if [ -d "app" ] && [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"vocoplan-dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.vocoplan.app"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          fi

      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VocoPlan-APK
          path: "**/build/outputs/apk/**/*.apk"
